hostname r3
!
vrf RED
exit-vrf
!
vrf BLUE
exit-vrf
!
segment-routing
 srv6
  encapsulation
   source-address fc00::3
  exit
  locators
   locator MAIN
    prefix fc00:3::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address fc00::3/128
 ipv6 router isis 1
exit
!
interface eth1
 ipv6 address fc00:23::3/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 is-type level-1
 net 49.0000.0000.0000.0003.00
 topology ipv6-unicast
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000
 bgp router-id 10.255.255.3
 no bgp default ipv4-unicast
 neighbor fc00::1 remote-as 65000
 neighbor fc00::1 update-source lo
 !
 address-family ipv4 vpn
  neighbor fc00::1 activate
 exit-address-family
 !
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000 vrf RED
 bgp router-id 10.255.255.3
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 3:100
  nexthop vpn export fc00::3
  rt vpn both 65000:100
  sid vpn export auto
  import vpn
  export vpn
 exit-address-family
exit
!
router bgp 65000 vrf BLUE
 bgp router-id 10.255.255.3
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 3:200
  nexthop vpn export fc00::3
  rt vpn both 65000:200
  sid vpn export auto
  import vpn
  export vpn
 exit-address-family
exit
