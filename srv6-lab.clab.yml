name: srv6-lab

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1
    sysctls:
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.conf.all.forwarding: 1
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    r1:
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf
        - r1/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -qw net.vrf.strict_mode=1
        - sysctl -qw net.ipv6.conf.eth1.seg6_enabled=1
        - ip link add RED type vrf table 100
        - ip link set RED up
        - ip link add BLUE type vrf table 200
        - ip link set BLUE up
        - ip link add lo-red type dummy
        - ip link set lo-red master RED
        - ip link set lo-red up
        - ip addr add 10.0.1.1/32 dev lo-red
        - ip link add lo-blue type dummy
        - ip link set lo-blue master BLUE
        - ip link set lo-blue up
        - ip addr add 10.1.1.1/32 dev lo-blue
        - vtysh -b

    r2:
      binds:
        - r2/daemons:/etc/frr/daemons
        - r2/frr.conf:/etc/frr/frr.conf
        - r2/vtysh.conf:/etc/frr/vtysh.conf

    r3:
      binds:
        - r3/daemons:/etc/frr/daemons
        - r3/frr.conf:/etc/frr/frr.conf
        - r3/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -qw net.vrf.strict_mode=1
        - sysctl -qw net.ipv6.conf.eth1.seg6_enabled=1
        - ip link add RED type vrf table 100
        - ip link set RED up
        - ip link add BLUE type vrf table 200
        - ip link set BLUE up
        - ip link add lo-red type dummy
        - ip link set lo-red master RED
        - ip link set lo-red up
        - ip addr add 10.0.3.1/32 dev lo-red
        - ip link add lo-blue type dummy
        - ip link set lo-blue master BLUE
        - ip link set lo-blue up
        - ip addr add 10.1.3.1/32 dev lo-blue
        - vtysh -b

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
