hostname p2
!
segment-routing
 srv6
  encapsulation
   source-address fc00::2
  exit
  locators
   locator MAIN
    prefix fc00:2::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address fc00::2/128
 ipv6 router isis 1
exit
!
interface eth1
 ipv6 address fc00:0:2::2/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth2
 ipv6 address fc00:0:4::2/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth3
 ipv6 address fc00:0:a::1/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth4
 ipv6 address fc00:0:b::2/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 is-type level-1
 net 49.0000.0000.0000.0002.00
 topology ipv6-unicast
 segment-routing srv6
  locator MAIN
 exit
exit
