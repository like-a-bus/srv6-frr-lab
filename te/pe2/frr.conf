hostname pe2
!
vrf RED
exit-vrf
!
segment-routing
 srv6
  encapsulation
   source-address fc00::12
  exit
  locators
   locator MAIN
    prefix fc00:12::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address fc00::12/128
 ipv6 router isis 1
exit
!
interface eth1
 ipv6 address fc00:0:3::1/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth2
 ipv6 address fc00:0:4::1/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 is-type level-1
 net 49.0000.0000.0000.0012.00
 topology ipv6-unicast
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000
 bgp router-id 10.255.0.12
 no bgp default ipv4-unicast
 neighbor RR peer-group
 neighbor RR remote-as 65000
 neighbor RR update-source lo
 neighbor fc00::1 peer-group RR
 neighbor fc00::3 peer-group RR
 !
 address-family ipv4 vpn
  neighbor RR activate
 exit-address-family
 !
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000 vrf RED
 bgp router-id 10.255.0.12
 no bgp ebgp-requires-policy
 neighbor 192.168.12.1 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 192.168.12.1 activate
  rd vpn export 12:100
  rt vpn both 65000:100
  sid vpn export auto
  import vpn
  export vpn
  maximum-paths ibgp 4
 exit-address-family
exit
