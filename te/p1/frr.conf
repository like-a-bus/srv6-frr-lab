hostname p1
!
segment-routing
 srv6
  encapsulation
   source-address fc00::1
  exit
  locators
   locator MAIN
    prefix fc00:1::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address fc00::1/128
 ipv6 router isis 1
exit
!
interface eth1
 ipv6 address fc00:0:1::2/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth2
 ipv6 address fc00:0:3::2/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth3
 ipv6 address fc00:0:9::1/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
interface eth4
 ipv6 address fc00:0:b::1/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 is-type level-1
 net 49.0000.0000.0000.0001.00
 topology ipv6-unicast
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 neighbor RRC peer-group
 neighbor RRC remote-as 65000
 neighbor RRC update-source lo
 neighbor fc00::11 peer-group RRC
 neighbor fc00::12 peer-group RRC
 neighbor fc00::13 peer-group RRC
 neighbor fc00::14 peer-group RRC
 !
 address-family ipv4 vpn
  neighbor RRC activate
  neighbor RRC route-reflector-client
 exit-address-family
exit
