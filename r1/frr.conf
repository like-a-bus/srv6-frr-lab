hostname r1
!
vrf vrf1
exit-vrf
!
segment-routing
 srv6
  static-sids
   sid fc00:1:0:0:100::/128 locator loc1 behavior uDT4 vrf vrf1
  exit
  locators
   locator loc1
    prefix fc00:1::/64 block-len 40 node-len 24 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address fc00::1/128
 ipv6 router isis 1
exit
!
interface eth1
 ipv6 address fc00:12::1/64
 ipv6 router isis 1
 isis network point-to-point
exit
!
router isis 1
 is-type level-1
 net 49.0000.0000.0000.0001.00
 topology ipv6-unicast
 segment-routing srv6
  locator loc1
 exit
exit
!
ip route 10.0.3.1/32 fc00:3:0:0:100:: vrf vrf1 nexthop-vrf default segments fc00:3:0:0:100::
